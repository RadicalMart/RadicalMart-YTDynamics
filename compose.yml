services:
  db:
    image: 'mariadb:11'
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_EXTRA_FLAGS: --bind-address=0.0.0.0
      MARIADB_HOST: '%'
    volumes:
      - joomla_db:/var/lib/mysql
    restart: unless-stopped
    networks:
        - network

  app:
    depends_on:
      - db
    build:
      context: ./docker/joomla
      dockerfile: Dockerfile
    ports:
      - "${JOOMLA_PORT}:80"
    environment:
      JOOMLA_SITE_NAME: ${JOOMLA_SITE_NAME}
      JOOMLA_ADMIN_USER: ${JOOMLA_ADMIN_USER}
      JOOMLA_ADMIN_USERNAME: ${JOOMLA_ADMIN_USERNAME}
      JOOMLA_ADMIN_PASSWORD: ${JOOMLA_ADMIN_PASSWORD}
      JOOMLA_ADMIN_EMAIL: ${JOOMLA_ADMIN_EMAIL}
      JOOMLA_DB_HOST: ${JOOMLA_DB_HOST}
      JOOMLA_DB_NAME: ${JOOMLA_DB_NAME}
      JOOMLA_DB_USER: ${JOOMLA_DB_USER}
      JOOMLA_DB_PASSWORD: ${JOOMLA_DB_PASSWORD}
      JOOMLA_EXTENSIONS_URLS: ${JOOMLA_EXTENSIONS_URLS}
      JOOMLA_EXTENSIONS_PATHS: ${JOOMLA_EXTENSIONS_PATHS}
      PHP_IDE_CONFIG: serverName=localhost
      UPLOAD_MAX_FILESIZE: ${UPLOAD_MAX_FILESIZE:-50M}
      SOVMART_TOKEN: ${SOVMART_TOKEN}
      RADICAL_MART_VERSION_ID: ${RADICAL_MART_VERSION_ID}
      XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003 idekey=PHPSTORM
      XDEBUG_MODE: debug
    volumes:
      - ./www:/var/www/html
      - ./elements:/var/www/html/plugins/system/ytdynamics/elements
      - ./language/en-GB/plg_system_ytdynamics.ini:/var/www/html/administrator/language/en-GB/plg_system_ytdynamics.ini
      - ./language/en-GB/plg_system_ytdynamics.sys.ini:/var/www/html/administrator/language/en-GB/plg_system_ytdynamics.sys.ini
      - ./language/ru-RU/plg_system_ytdynamics.ini:/var/www/html/administrator/language/ru-RU/plg_system_ytdynamics.ini
      - ./language/ru-RU/plg_system_ytdynamics.sys.ini:/var/www/html/administrator/language/ru-RU/plg_system_ytdynamics.sys.ini
      - ./languages:/var/www/html/plugins/system/ytdynamics/languages
      - ./media:/var/www/html/media/plg_system_ytdynamics
      - ./services:/var/www/html/plugins/system/ytdynamics/services
      - ./src:/var/www/html/plugins/system/ytdynamics/src
      - ./template:/var/www/html/plugins/system/ytdynamics/template
      - ./script.php:/var/www/html/plugins/system/ytdynamics/script.php
      - ./ytdynamics.xml:/var/www/html/plugins/system/ytdynamics/ytdynamics.xml
      - ./tmp:/var/www/html/tmp
    restart: unless-stopped
    hostname: 'localhost'
    networks:
        - network


volumes:
  joomla_db:
      name: ${COMPOSE_PROJECT_NAME}-db-data
      driver: local

networks:
    network:
        name: ${COMPOSE_PROJECT_NAME}-network
        driver: bridge
